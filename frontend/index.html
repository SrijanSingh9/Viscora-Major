<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1117" /> <!-- Matches your dark mode background -->

    <!-- Primary Meta Tags -->
    <title>Viscora Nexus | AI Journal & Companion</title>
    <meta name="title" content="Viscora Nexus | AI Journal & Companion" />
    <meta name="description" content="Viscora Nexus is an empathetic, highly intelligent AI journal companion. Reflect on your day, track your mood, and gain deep psychological insights to fuel your personal growth." />
    <meta name="keywords" content="AI journal, mental health, reflection, AI companion, diary, self-improvement, mindfulness" />
    <meta name="author" content="Srijan Singh" />

    <!-- Open Graph / Facebook / Discord / WhatsApp (Social Media Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Viscora Nexus" />
    <meta property="og:url" content="https://viscora-nexus.vercel.app/" />
    <meta property="og:title" content="Viscora Nexus | AI Journal & Companion" />
    <meta property="og:description" content="An empathetic AI journal companion. Reflect on your day and gain deep psychological insights for personal growth." />
    
    <!-- WHATSAPP CRITICAL: URL must be absolute. Use .png or .jpg (WhatsApp ignores .svg files). Keep size under 300KB! -->
    <meta property="og:image" content="https://viscora-nexus.vercel.app/public/image.png" /> 
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://viscora-nexus.vercel.app/" />
    <meta property="twitter:title" content="Viscora Nexus | AI Journal & Companion" />
    <meta property="twitter:description" content="An empathetic AI journal companion. Reflect on your day and gain deep psychological insights for personal growth." />
    <meta property="twitter:image" content="https://viscora-nexus.vercel.app/public/image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/file.svg" />
    <link rel="apple-touch-icon" href="/file.svg" /> <!-- For users adding to iOS Home Screen -->

    <!-- Fonts (Preconnecting speeds up font loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
